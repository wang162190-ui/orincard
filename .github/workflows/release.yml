name: Controlled Production Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full tested commit SHA on main
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.commit }}

jobs:
  test:
    runs-on: ubuntu-latest
    # guard 3（tests/cloud/release-guards.test.ts）读的是进程环境里这六个变量。不映射进来，
    # 它在 CI 里就是恒红的——那不是「发布被拦住」，是闸门自己坏了，而这两种红分不出来就等于没有闸门。
    # 放仓库级而不是 environment 级：environment 可以挂人工审批，挂上去会变成「先审批再跑测试」，
    # 把「测试通过才提升」的顺序整个倒过来。这六个是测试模式的配置，仓库级的暴露面可以接受。
    # STRIPE_LIVE_SECRET_KEY 故意不映射：guard 3 要求它在验收期间必须为空。
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_MONTHLY_PRICES_JSON: ${{ secrets.STRIPE_TEST_MONTHLY_PRICES_JSON }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_TEST_ACCEPTANCE_PLAN_KEY: ${{ vars.STRIPE_TEST_ACCEPTANCE_PLAN_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      RUN_STRIPE_SANDBOX_LIFECYCLE: ${{ vars.RUN_STRIPE_SANDBOX_LIFECYCLE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Require the exact commit on origin/main
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:planning
      # pnpm test 是 `vitest run --exclude 'tests/cloud/**'`，而发布阻断器恰好住在 tests/cloud 里。
      # 不显式跑这一条，受控发布就会绕过自己的发布守卫直奔生产——「失败不晋升」形同虚设。
      # 这些守卫现在是红的（法律文本未审定等，见 docs/roadmap.md 的阻断清单），红就该拦住发布。
      - run: pnpm exec vitest run tests/cloud/release-guards.test.ts
      # 同理：回滚演练里「迁移只加不减」和「website 最后部署」两条是发布闸门，不是事后报告。
      # 网站回滚的安全性完全靠这两条支撑（worker 载荷校验器没有任何版本容忍度，见
      # docs/acceptance/release-drill.md），所以它们必须在迁移执行之前拦住发布。
      - run: pnpm exec vitest run tests/cloud/release-drill.test.ts
      - run: git diff --check

  migrate:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Require the production database target
        run: test -n "$SUPABASE_PROJECT_REF" && test "$SUPABASE_PROJECT_REF" = "$SUPABASE_PRODUCTION_PROJECT_REF"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply only migrations committed in the tested SHA
        run: pnpm exec supabase db push --linked --include-all

  worker:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec trigger deploy --env prod --external-id "$RELEASE_SHA"
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

  website:
    needs: worker
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the production website target
        run: test -n "$SUPABASE_PROJECT_REF" && test "$SUPABASE_PROJECT_REF" = "$SUPABASE_PRODUCTION_PROJECT_REF"
      - run: pnpm dlx vercel@59.15.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@59.15.1 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@59.15.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
